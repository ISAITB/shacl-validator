name: build
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: main
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ secrets.CACHE_VERSION }}-
      - name: Resolve itb-commons
        id: commons
        working-directory: main
        run: |
          pom_get() { python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.argv[1]).getroot().findtext(sys.argv[2]) or "")' "$1" "$2"; }
          PARENT_VERSION=$(pom_get pom.xml '{*}parent/{*}version')
          PROPERTY_VERSION=$(pom_get pom.xml '{*}properties/{*}version.itbCommons')
          if [ -z "$PARENT_VERSION" ] || [ "$PARENT_VERSION" != "$PROPERTY_VERSION" ]; then
            echo "::error::The itb-commons parent version ('$PARENT_VERSION') and version.itbCommons ('$PROPERTY_VERSION') must be set and identical in pom.xml"
            exit 1
          fi
          VERSION="$PARENT_VERSION"
          REPO=~/.m2/repository/eu/europa/ec/itb/commons
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            # Snapshot: always use the itb-commons development branch.
            REF="development"
            INSTALL=true
          else
            # Stable release: use the itb-commons tag, and skip the build if it is already in the Maven cache.
            REF="$VERSION"
            if [ -f "$REPO/validator-parent/$VERSION/validator-parent-$VERSION.pom" ] && [ -f "$REPO/validation-commons/$VERSION/validation-commons-$VERSION-tests.jar" ]; then
              INSTALL=false
            else
              INSTALL=true
            fi
          fi
          echo "itb-commons $VERSION -> ref '$REF' (install: $INSTALL)"
          {
            echo "version=$VERSION"
            echo "ref=$REF"
            echo "install=$INSTALL"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.commons.outputs.install == 'true'
        with:
          repository: ISAITB/itb-commons
          ref: ${{ steps.commons.outputs.ref }}
          path: commons
      - name: Install commons
        if: steps.commons.outputs.install == 'true'
        run: |
          COMMONS_VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().findtext("{*}version") or "")')
          if [ "$COMMONS_VERSION" != "${{ steps.commons.outputs.version }}" ]; then
            echo "::error::itb-commons ref '${{ steps.commons.outputs.ref }}' has version '$COMMONS_VERSION' but the validator requires '${{ steps.commons.outputs.version }}'"
            exit 1
          fi
          mvn -B install -DskipTests=true
        working-directory: commons
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        working-directory: main
