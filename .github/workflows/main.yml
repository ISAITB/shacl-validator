name: build
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: main
      - name: Resolve itb-commons branch
        id: commons-ref
        run: |
          if git ls-remote --exit-code --heads https://github.com/ISAITB/itb-commons.git "$GITHUB_REF_NAME" > /dev/null; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          repository: ISAITB/itb-commons
          ref: ${{ steps.commons-ref.outputs.ref }}
          path: commons
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ secrets.CACHE_VERSION }}|
      - name: Install commons
        run: mvn -B install -DskipTests=true
        working-directory: commons
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        working-directory: main